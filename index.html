<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>动态雪糕 | 稳定版</title>
    <style>
        :root {
            --switch-dur: 0.45s;
            --switch-ease: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* 主题系统 */
        [data-theme="0"] {
            --bg-start: #ff7eb3;
            --bg-mid: #ff758c;
            --bg-end: #ff758c;
            --ice-color: #FFB6C1;
            --ice-highlight: rgba(255, 255, 255, 0.65);
            --stick-color: #D2B48C;
            --drip-color: #FF8DA1;
            --pattern: radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.2) 4px, transparent 4px), radial-gradient(circle at 75% 60%, rgba(255, 255, 255, 0.15) 6px, transparent 6px);
        }
        [data-theme="1"] {
            --bg-start: #84fab0;
            --bg-mid: #8fd3f4;
            --bg-end: #a8e6cf;
            --ice-color: #A8E6CF;
            --ice-highlight: rgba(255, 255, 255, 0.5);
            --stick-color: #C4A484;
            --drip-color: #88D8B0;
            --pattern: repeating-linear-gradient(45deg, transparent, transparent 12px, rgba(255, 255, 255, 0.18) 12px, rgba(255, 255, 255, 0.18) 14px);
        }
        [data-theme="2"] {
            --bg-start: #ff9a44;
            --bg-mid: #fc6076;
            --bg-end: #f6d365;
            --ice-color: #8B4513;
            --ice-highlight: rgba(255, 255, 255, 0.25);
            --stick-color: #DEB887;
            --drip-color: #A0522D;
            --pattern: radial-gradient(circle at 40% 25%, rgba(255, 255, 255, 0.25) 8px, transparent 8px), radial-gradient(circle at 65% 70%, rgba(255, 255, 255, 0.15) 10px, transparent 10px);
        }
        [data-theme="3"] {
            --bg-start: #a18cd1;
            --bg-mid: #fbc2eb;
            --bg-end: #6a5acd;
            --ice-color: #6A5ACD;
            --ice-highlight: rgba(200, 200, 255, 0.6);
            --stick-color: #D2B48C;
            --drip-color: #7B68EE;
            --pattern: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.25) 42%, transparent 45%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
        }
        body {
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-mid), var(--bg-end));
            transition: background 1s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            overscroll-behavior: none;
            -webkit-overflow-scrolling: auto;
            /* 移除 position: fixed; inset: 0; */
        }

        /* 背景粒子 */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            bottom: -30px;
            opacity: 0.7;
            will-change: transform, opacity;
            animation: floatUp linear infinite;
        }
        .particle.heart::before {
            content: "❤";
            color: #FF69B4;
            font-size: 20px;
        }
        .particle.snow::before {
            content: "❄";
            color: #E0F7FA;
            font-weight: bold;
            font-size: 20px;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.6);
                opacity: 0;
            }
            15% {
                opacity: 0.8;
            }
            85% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg) scale(1.1);
                opacity: 0;
            }
        }

        /* 雪糕主体场景 */
        .scene {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* popsicle 容器 - 使用 relative 定位，body 和 stick 在其中 absolute 定位 */
        .popsicle {
            position: relative;
            width: 130px;
            height: 260px;
            margin-bottom: 36px;
            cursor: pointer;
            touch-action: none;
            -webkit-touch-callout: none;
        }

        /* 切换动画 */
        .popsicle.switching {
            animation: switchAnim 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        @keyframes switchAnim {
            0% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: scale(0.82) rotate(-6deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        /* 咬一口震动 */
        .popsicle.bite {
            animation: biteShake 0.3s ease-out;
        }

        @keyframes biteShake {
            0% {
                transform: scale(1);
            }
            25% {
                transform: scale(0.95) rotate(-3deg);
            }
            50% {
                transform: scale(1.02) rotate(2deg);
            }
            75% {
                transform: scale(0.98) rotate(-1deg);
            }
            100% {
                transform: scale(1);
            }
        }

        /* 雪糕身体 - absolute 定位，底部固定在棍子上方 */
        .body {
            position: absolute;
            bottom: 62px;
            /* 固定在棍子顶部上方，确保无缝连接 */
            left: 0;
            width: 100%;
            height: 155px;
            background: var(--ice-color);
            background-image: var(--pattern);
            border-radius: 50px 50px 24px 24px;
            /* 增强投影和轮廓，防止与背景融合 */
            box-shadow: inset -10px -8px 20px rgba(0, 0, 0, 0.12),
                0 18px 36px rgba(0, 0, 0, 0.25),
                0 0 0 4px rgba(255, 255, 255, 0.2);
            animation: breathe 3.2s ease-in-out infinite;
            will-change: transform, height;
            transition: background-color 0.45s ease, background-image 0.45s ease, box-shadow 0.45s ease, height 0.28s cubic-bezier(0.25, 0.8, 0.25, 1.2), opacity 0.35s ease, border-radius 0.28s ease;
            transform-origin: bottom center;
            overflow: visible;
            z-index: 2;
        }

        @keyframes breathe {
            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-8px) rotate(1.8deg);
            }
        }

        /* 高光 */
        .highlight {
            position: absolute;
            top: 24px;
            left: 30px;
            width: 30px;
            height: 90px;
            background: linear-gradient(to bottom, var(--ice-highlight), transparent 75%);
            border-radius: 50%;
            transform: rotate(16deg);
            animation: shimmer 5s ease-in-out infinite;
            transition: background 0.45s ease, opacity 0.3s ease;
            pointer-events: none;
        }

        @keyframes shimmer {
            0%,
            100% {
                opacity: 0.3;
                transform: rotate(16deg) translate(0, 0);
            }
            50% {
                opacity: 0.8;
                transform: rotate(16deg) translate(10px, 8px);
            }
        }

        /* 棍子 - absolute 定位在容器底部 */
        .stick {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 28px;
            height: 75px;
            margin-left: -14px;
            background: var(--stick-color);
            border-radius: 0 0 16px 16px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.22);
            transition: background-color 0.45s ease;
            z-index: 1;
        }

        /* 滴落的水滴 - 在 body 内部，相对于 body 底部 */
        .drip {
            position: absolute;
            bottom: -6px;
            width: 14px;
            height: 14px;
            background: var(--drip-color);
            border-radius: 50% 50% 50% 0;
            transform: rotate(45deg);
            transition: background-color 0.45s ease;
            animation: drop 2.6s ease-in infinite;
            z-index: 3;
            pointer-events: none;
        }

        .drip:nth-of-type(2) {
            left: 20px;
        }
        .drip:nth-of-type(3) {
            left: 88px;
            animation-delay: 1.3s;
        }

        @keyframes drop {
            0% {
                transform: rotate(45deg) translateY(0) scale(1);
                opacity: 0.85;
            }
            70% {
                opacity: 0.6;
            }
            100% {
                transform: rotate(45deg) translateY(70px) scale(0.35);
                opacity: 0;
            }
        }

        /* 提示文字 */
        .hint {
            color: rgba(255, 255, 255, 0.95);
            font-size: 14px;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.22);
            padding: 10px 20px;
            border-radius: 20px;
            animation: pulseHint 2s ease-in-out infinite alternate;
            text-align: center;
            max-width: 90%;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        @keyframes pulseHint {
            0% {
                opacity: 0.6;
                transform: translateY(0);
            }
            100% {
                opacity: 1;
                transform: translateY(-4px);
            }
        }

        /* 糖屑特效 */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            animation: popOut 0.8s ease-out forwards;
        }

        @keyframes popOut {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0) rotate(720deg);
                opacity: 0;
            }
        }

        /* 彩蛋状态 - 放在 body 内部，显示在残存雪糕上方 */
        .empty-state {
            position: absolute;
            top: -90px;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 70px;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 10;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
        }

        .empty-state.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .empty-text {
            position: absolute;
            bottom: -36px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            width: 200px;
            text-align: center;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: all 0.5s ease 0.2s;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 12px;
            border-radius: 10px;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
        }

        .empty-text.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01s !important;
                transition-duration: 0.01s !important;
            }
        }

        /* 小屏手机优化 */
        @media (max-width: 380px) {
            .popsicle {
                width: 110px;
                height: 230px;
                margin-bottom: 28px;
            }
            .body {
                bottom: 54px;
                height: 130px;
                border-radius: 44px 44px 20px 20px;
            }
            .stick {
                width: 24px;
                height: 64px;
                margin-left: -12px;
            }
            .highlight {
                top: 18px;
                left: 24px;
                width: 24px;
                height: 70px;
            }
            .drip:nth-of-type(2) {
                left: 16px;
            }
            .drip:nth-of-type(3) {
                left: 72px;
            }
            .empty-state {
                top: -75px;
                font-size: 56px;
            }
            .empty-text {
                bottom: -30px;
                font-size: 14px;
                width: 170px;
            }
            .hint {
                font-size: 12px;
                padding: 8px 16px;
            }
        }
        /* 爱心温馨提示 */
        .love-hint {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            font-size: 13px;
            line-height: 1.4;
            text-align: center;
            max-width: 280px;
            animation: floatLove 3s ease-in-out infinite;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            pointer-events: none; /* 不干扰点击 */
            z-index: 5;
        }

        .love-hint .heart-icon {
            font-size: 18px;
            animation: beatHeart 1.2s ease-in-out infinite;
            display: inline-block;
            transform-origin: center;
        }

        .love-hint .hint-text {
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* 爱心跳动动画 */
        @keyframes beatHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        /* 提示框轻微浮动 */
        @keyframes floatLove {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        /* 移动端适配 */
        @media (max-width: 380px) {
            .love-hint {
                margin-top: 12px;
                padding: 8px 14px;
                font-size: 12px;
                max-width: 240px;
                gap: 6px;
            }
            .love-hint .heart-icon {
                font-size: 16px;
            }
        }

        /* 暗色主题下增强对比度 */
        [data-theme="2"] .love-hint {
            background: rgba(0, 0, 0, 0.25);
            border-color: rgba(255, 255, 255, 0.35);
        }
    </style>
</head>
<body data-theme="0">
    <div class="particles" id="particles"></div>
    <main class="scene">
        <div class="popsicle" id="popsicle">
            <div class="body" id="iceBody">
                <div class="highlight"></div>
                <div class="drip"></div>
                <div class="drip"></div>
                <div class="empty-state" id="emptyEmoji">🤤</div>
                <div class="empty-text" id="emptyText">太好吃啦！双击重置</div>
            </div>
            <div class="stick"></div>
        </div>
        <div class="hint">👆 点击咬一口 / 上滑换口味 / 长按加速融化</div>

        <div class="love-hint" id="loveHint">
            <span class="heart-icon">💗</span>
            <span class="hint-text">雪糕好吃，也不要贪嘴，照顾好自己哦，琳</span>
        </div>
    </main>

    <script>
        (function() {
            'use strict';

            // 1. 粒子系统
            const pContainer = document.getElementById('particles');
            const particleCount = 25;

            for (let i = 0; i < particleCount; i++) {
                const el = document.createElement('span');
                const type = Math.random() > 0.5 ? 'heart' : 'snow';
                const left = Math.random() * 100;
                const duration = 8 + Math.random() * 12;
                const delay = Math.random() * -duration;
                const scale = 0.6 + Math.random() * 0.8;

                el.className = `particle ${type}`;
                el.style.cssText =
                    `left:${left}%;animation-duration:${duration}s;animation-delay:${delay}s;transform:scale(${scale})`;
                pContainer.appendChild(el);
            }

            // 2. 状态管理
            const state = {
                currentTheme: 0,
                iceHeight: 155, // 默认高度（桌面端）
                initialIceHeight: 155,
                isSwitching: false,
                isMelting: false,
                isFinished: false,
                longPressTimer: null,
                startY: 0,
                startTime: 0,
                bodyBottom: 62, // body 的 bottom 值（桌面端）
            };

            // 响应式初始值
            function updateResponsiveDefaults() {
                if (window.innerWidth <= 380) {
                    state.iceHeight = 130;
                    state.initialIceHeight = 130;
                    state.bodyBottom = 54;
                } else {
                    state.iceHeight = 155;
                    state.initialIceHeight = 155;
                    state.bodyBottom = 62;
                }
                // 同步 DOM
                elements.iceBody.style.height = state.iceHeight + 'px';
                elements.iceBody.style.bottom = state.bodyBottom + 'px';
            }

            // DOM 元素
            const elements = {
                popsicle: document.getElementById('popsicle'),
                iceBody: document.getElementById('iceBody'),
                emptyEmoji: document.getElementById('emptyEmoji'),
                emptyText: document.getElementById('emptyText'),
                body: document.body,
                highlight: document.querySelector('.highlight'),
            };

            // 初始化响应式值
            updateResponsiveDefaults();

            // 窗口大小变化时更新
            let resizeDebounce = null;
            window.addEventListener('resize', function() {
                if (resizeDebounce) clearTimeout(resizeDebounce);
                resizeDebounce = setTimeout(function() {
                    if (!state.isFinished) {
                        updateResponsiveDefaults();
                    } else {
                        // 如果已吃完，只更新 bodyBottom 以便重置后使用
                        if (window.innerWidth <= 380) {
                            state.initialIceHeight = 130;
                            state.bodyBottom = 54;
                        } else {
                            state.initialIceHeight = 155;
                            state.bodyBottom = 62;
                        }
                    }
                }, 300);
            });

            // 3. 切换主题
            function switchTheme(direction) {
                if (state.isSwitching || state.isMelting) return;

                state.isSwitching = true;
                
                // 立即切换主题（背景立刻开始渐变）
                state.currentTheme = (state.currentTheme + direction + 4) % 4;
                elements.body.setAttribute('data-theme', state.currentTheme);
                
                // 同时触发雪糕动画
                elements.popsicle.classList.add('switching');
                
                setTimeout(() => {
                    elements.popsicle.classList.remove('switching');
                    state.isSwitching = false;
                }, 450); // 动画结束后解锁
            }

            // 4. 动态调整 border-radius 和 highlight
            function updateBodyAppearance() {
                const h = state.iceHeight;
                const initialH = state.initialIceHeight;

                // 动态调整顶部圆角，防止小高度时圆角过大
                if (h < 60) {
                    const topRadius = Math.max(12, h * 0.45);
                    elements.iceBody.style.borderRadius = `${topRadius}px ${topRadius}px 18px 18px`;
                } else if (h >= initialH - 5) {
                    // 恢复默认圆角
                    if (window.innerWidth <= 380) {
                        elements.iceBody.style.borderRadius = '44px 44px 20px 20px';
                    } else {
                        elements.iceBody.style.borderRadius = '50px 50px 24px 24px';
                    }
                }

                // 动态调整高光透明度
                if (elements.highlight) {
                    if (h < 100) {
                        const opacity = Math.max(0, (h - 30) / 70);
                        elements.highlight.style.opacity = Math.min(1, Math.max(0, opacity));
                    } else {
                        elements.highlight.style.opacity = '';
                    }
                }
            }

            // 5. 咬一口逻辑 - 从上往下减少雪糕
            function takeBite(clientX, clientY) {
                if (state.isMelting || state.isFinished) return;

                // 移除并重新添加动画类以触发动画
                elements.popsicle.classList.remove('bite');
                // 强制回流
                void elements.popsicle.offsetWidth;
                elements.popsicle.classList.add('bite');

                // 雪糕变短 - body 底部固定，顶部下降
                if (state.iceHeight > 30) {
                    state.iceHeight = Math.max(30, state.iceHeight - 20);
                    elements.iceBody.style.height = state.iceHeight + 'px';

                    // 更新外观
                    updateBodyAppearance();

                    // 产生糖屑
                    if (clientX && clientY) {
                        createConfetti(clientX, clientY);
                    }

                    // 检查是否吃完
                    if (state.iceHeight <= 40) {
                        showEmptyState();
                    }
                }
            }

            // 6. 糖屑特效
            function createConfetti(x, y) {
                const colors = ['#FF69B4', '#FFD700', '#00FFFF', '#FF4500', '#7FFF00', '#FF1493', '#FFB6C1',
                    '#87CEEB'
                ];
                const particleCount = 15;

                for (let i = 0; i < particleCount; i++) {
                    const dot = document.createElement('div');
                    dot.className = 'confetti';

                    const angle = (Math.PI * 2 * i) / particleCount + Math.random() * 0.5;
                    const distance = 60 + Math.random() * 60;
                    const tx = Math.cos(angle) * distance;
                    const ty = Math.sin(angle) * distance - 50;

                    dot.style.setProperty('--tx', tx + 'px');
                    dot.style.setProperty('--ty', ty + 'px');
                    dot.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    dot.style.left = x + 'px';
                    dot.style.top = y + 'px';
                    dot.style.width = (6 + Math.random() * 10) + 'px';
                    dot.style.height = dot.style.width;

                    document.body.appendChild(dot);

                    // 清理
                    setTimeout(function() { dot.remove(); }, 800);
                }
            }

            // 7. 显示吃完状态
            function showEmptyState() {
                state.isFinished = true;
                elements.iceBody.style.opacity = '0.25';
                elements.emptyEmoji.classList.add('show');
                elements.emptyText.classList.add('show');
                // 吃完后让雪糕身体微微缩小
                elements.iceBody.style.transform = 'scale(0.9)';
            }

            // 8. 重置雪糕
            function resetIce() {
                if (!state.isFinished) return;

                state.isFinished = false;
                state.iceHeight = state.initialIceHeight;
                elements.iceBody.style.height = state.iceHeight + 'px';
                elements.iceBody.style.opacity = '1';
                elements.iceBody.style.transform = '';
                elements.emptyEmoji.classList.remove('show');
                elements.emptyText.classList.remove('show');

                // 恢复默认圆角
                updateBodyAppearance();
                if (elements.highlight) {
                    elements.highlight.style.opacity = '';
                }
            }

            // 9. 长按融化开始
            function startMelting(e) {
                if (state.isFinished || state.isSwitching) return;

                const touch = e.touches ? e.touches[0] : e;
                state.isMelting = true;

                // 延迟 500ms 后开始融化
                state.longPressTimer = setTimeout(function meltLoop() {
                    if (!state.isMelting) return;
                    takeBite(touch.clientX, touch.clientY);
                    if (state.isFinished) {
                        stopMelting();
                        return;
                    }
                    state.longPressTimer = setTimeout(meltLoop, 150);
                }, 500);
            }

            // 10. 停止融化
            function stopMelting() {
                state.isMelting = false;
                if (state.longPressTimer) {
                    clearTimeout(state.longPressTimer);
                    state.longPressTimer = null;
                }
            }

            // 11. 事件处理
            let lastClickTime = 0;
            let clickPending = false;
            let clickTimer = null;

            // 点击处理（使用 pointer 事件统一桌面和移动端）
            elements.popsicle.addEventListener('pointerdown', function(e) {
                if (e.pointerType === 'mouse' && e.button !== 0) return; // 只响应左键
                if (e.pointerType === 'touch' && e.isPrimary === false) return; // 只响应主触摸点

                startMelting(e);
            });

            elements.popsicle.addEventListener('pointerup', function(e) {
                stopMelting();
            });

            elements.popsicle.addEventListener('pointerleave', function(e) {
                stopMelting();
            });

            elements.popsicle.addEventListener('pointercancel', function(e) {
                stopMelting();
            });

            // click 事件处理咬一口（pointerup 之后触发）
            elements.popsicle.addEventListener('click', function(e) {
                // 如果正在融化（长按），忽略 click
                if (state.isMelting) return;

                const now = Date.now();
                if (now - lastClickTime < 350) {
                    // 双击检测
                    resetIce();
                    lastClickTime = 0;
                    if (clickTimer) clearTimeout(clickTimer);
                    clickTimer = null;
                } else {
                    // 单击 - 咬一口
                    takeBite(e.clientX, e.clientY);
                    lastClickTime = now;
                }
            });

            // 阻止右键菜单
            elements.popsicle.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });

            // 12. 滑动切换（在 document 上监听，但排除 popsicle 上的长按滑动）
            document.addEventListener('touchstart', function(e) {
                // 记录起始位置用于滑动检测
                if (e.touches.length === 1) {
                    state.startY = e.touches[0].clientY;
                    state.startTime = Date.now();
                }
            }, { passive: true });

            document.addEventListener('touchend', function(e) {
                if (e.changedTouches.length === 0) return;
                const endY = e.changedTouches[0].clientY;
                const diff = state.startY - endY;
                const timeDiff = Date.now() - state.startTime;

                // 需要足够的滑动距离和速度
                if (Math.abs(diff) > 50 && timeDiff < 500 && timeDiff > 30) {
                    if (diff > 0) {
                        switchTheme(1); // 上滑 → 下一个口味
                    } else {
                        switchTheme(-1); // 下滑 → 上一个口味
                    }
                }
            }, { passive: true });

            // 13. 滚轮切换（桌面端）
            let wheelTimeout = null;
            document.addEventListener('wheel', function(e) {
                if (wheelTimeout) return;

                if (Math.abs(e.deltaY) > 30) {
                    if (e.deltaY < 0) {
                        switchTheme(1);
                    } else {
                        switchTheme(-1);
                    }

                    wheelTimeout = setTimeout(function() {
                        wheelTimeout = null;
                    }, 600);
                }
            }, { passive: true });

            // 14. 键盘控制
            document.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    switchTheme(1);
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    switchTheme(-1);
                } else if (e.key === ' ' || e.key === 'Enter') {
                    e.preventDefault();
                    const rect = elements.popsicle.getBoundingClientRect();
                    takeBite(rect.left + rect.width / 2, rect.top + rect.height / 3);
                } else if (e.key === 'r' || e.key === 'R') {
                    e.preventDefault();
                    resetIce();
                }
            });

            // 15. 初始外观设置
            updateBodyAppearance();

            console.log('🍦 动态雪糕已就绪！');
            console.log('  👆 点击 = 咬一口（从上往下）');
            console.log('  ⏱️ 长按 = 加速融化');
            console.log('  👆👆 双击 = 重置（吃完后）');
            console.log('  📜 上滑/滚轮 = 切换口味');
            console.log('  ⌨️ 方向键/空格 = 桌面端操作');
        })();
    </script>
</body>
</html>
